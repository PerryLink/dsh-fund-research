# dsh-fund-research bundle patch: mount the mutual-fund research plugin.
#
# The plugin injects `storageDomain` for its snapshot layer. The shipped
# profiles (web/headless/sdk/acp) compose the storage stack (storage +
# storage-json + storage-domain) through the dsh-base bundle, so this patch
# mounts only the plugin row. A bare profile without dsh-base must compose the
# storage stack itself. Every config key below is a Schemastery field of the
# owning plugin; invalid values fail the profile load loudly. See README.md
# "Configuration" for the full table.
- insert:
    - id: dsh-fund-research
      name: dsh-fund-research
      config:
        # Master switch. On by default; `false` mounts nothing at all.
        enabled: true
        # Data-source endpoints (public Tiantian Fund / Eastmoney pages; no
        # key, no login). Override only to point at a mirror.
        eastmoneyBaseUrl: 'https://fund.eastmoney.com'
        f10BaseUrl: 'https://fundf10.eastmoney.com'
        quoteBaseUrl: 'https://push2.eastmoney.com'
        # Fallback quote host tried per stock when the primary fails
        # (Eastmoney's own delayed-quote host). '' disables the fallback.
        quoteFallbackBaseUrl: 'https://push2delay.eastmoney.com'
        # Polite collection: minimum gap between outbound requests.
        requestIntervalMs: 1000
        # Per-request timeout and retry budget (exponential backoff).
        timeoutMs: 15000
        retries: 2
        # Storage-domain snapshot reuse window; older snapshots are refetched.
        cacheTtlHours: 12
        # Annual risk-free rate used by the Sharpe ratio.
        riskFreeRate: 0.02
        # Offline mode: never send requests; read the snapshot layer only.
        offline: false
        # Workspace-relative directory the versioned report tree is sealed into.
        reportRoot: fund-reports
        # Fetch per-stock valuation quotes for the style-attribution section.
        # Disable to skip that fetch layer (the section reports a data gap).
        styleQuotes: true
