packages:
  - .

nodeLinker: hoisted
onlyBuiltDependencies:
  - esbuild
# The @deepseek-ai peer family is published inside the registry's
# minimum-release-age window; exclude the whole scope so installs resolve
# without waiting out the age floor (this covers every 0.1.1-rc.2 peer).
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
allowBuilds:
  esbuild: true
verifyDepsBeforeRun: false
