name: Endpoint liveness

on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # setup-node@v5 auto-enables package-manager caching from package.json#packageManager
          # (pnpm here). This job only runs `node`, so requiring pnpm on PATH made the step fail
          # with "Unable to locate executable file: pnpm" before any probe ran. Disable the
          # automatic cache instead of installing a package manager this job does not use.
          package-manager-cache: false
      - name: Probe declared endpoints
        run: node scripts/check-endpoints.mjs
        env:
          TIMEOUT_MS: '15000'
